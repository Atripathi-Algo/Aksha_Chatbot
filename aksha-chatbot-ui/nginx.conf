server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSE streaming — no buffering, no timeout cap on the chat endpoint.
    location /v1/chat/stream {
        proxy_pass http://aksha-chatbot-api:8010/v1/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Everything else under /v1 (health checks, /v1/chat/invoke) — plain proxy.
    location /v1/ {
        proxy_pass http://aksha-chatbot-api:8010/v1/;
        proxy_http_version 1.1;
    }

    # Single-page app — no client-side router today, but this keeps a
    # hard refresh working if one gets added later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
