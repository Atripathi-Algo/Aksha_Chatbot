# Aksha Chatbot — plug-and-play deployment onto a machine already running
# the real Aksha stack (see docker-compose.yml / Aksha_Deployment):
# react_frontend on :3000, node_backend on :5000, service_api on :4000,
# mongodb on :27017 — all on the `aksha-net` Docker network. This file adds
# two more services to that same network so aksha-chatbot-api can reach the
# others by container name, with every port and backend address driven from
# chatbot.env (edit that file, not this one).
#
# Usage:
#   cp chatbot.env.example chatbot.env   # fill in GROQ_API_KEY or OLLAMA_*, adjust ports if needed
#   docker compose -f docker-compose.chatbot.yml --env-file chatbot.env up -d --build
#   open http://<this-machine>:<CHATBOT_UI_PORT, default 8080>
#
# If the real Aksha stack is NOT on a Docker network named aksha-net (e.g.
# it runs natively, not in Docker), delete the `networks:` blocks below and
# set NODE_API_BASE_URL / SERVICE_API_BASE_URL in chatbot.env to
# http://host.docker.internal:<port> instead.

name: aksha-chatbot

services:
  aksha-chatbot-api:
    build: ./aksha-chatbot-api
    image: aksha-chatbot-api:latest
    container_name: aksha-chatbot-api
    restart: always
    networks:
      - aksha-net
    volumes:
      - ${AKSHA_HOST_DATA_PATH:-../Aksha}:/srv/Aksha:ro
      # Found live 2026-09-16: the Dockerfile's build context is
      # aksha-chatbot-api/ alone, so docs/ (a sibling directory at the repo
      # root, next to aksha-chatbot-api/) was never in the image —
      # search_docs (Help & Product Guide) silently returned zero results in
      # every real deployment of this container. Same fix shape as the Aksha
      # data path above: bind-mount the real docs/ in, point the app at it
      # via CHATBOT_DOCS_DIR (see app/tools_help.py).
      - ./docs:/srv/docs:ro
      # Audit finding (second pass, 2026-09-16): date.today() in app/main.py
      # and app/graph.py resolves "today"/"yesterday" using the container's
      # own clock. Every other service in the real Aksha stack's
      # docker-compose.yml mounts these two files for exactly this reason;
      # this file omitted them. Without it, an operator east of UTC asking
      # about "today" between midnight and their UTC offset gets yesterday.
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Audit finding (second pass, 2026-09-16) recommended binding this to
      # 127.0.0.1, reasoning the UI never needs direct access — true for
      # aksha-chatbot-ui (this file's own frontend, same-origin nginx proxy,
      # VITE_CHATBOT_API_URL="" at build time). NOT true for this repo's
      # actual production deployment: AkshaV2-UIUX/frontend's ChatbotWidget
      # calls this exact port directly from the browser at the host's LAN
      # address (REACT_APP_CHATBOT_API_URL, .env.prod.example) — binding to
      # loopback would break every LAN browser's live chat. Left published;
      # the real fix is proxying that widget's calls through its own nginx
      # (AkshaV2-UIUX/frontend/nginx/conf.d/default.conf already proxies
      # /v1/ — pointing REACT_APP_CHATBOT_API_URL at a relative path instead
      # of the LAN IP would let this bind to loopback safely) and adding
      # auth (Section 5.1), tracked as a known gap rather than done here.
      - "${CHATBOT_API_PORT:-8010}:8010"
    env_file:
      - ./chatbot.env
    environment:
      AKSHA_DATA_PATH: /srv/Aksha
      CHATBOT_DOCS_DIR: /srv/docs

  aksha-chatbot-ui:
    build: ./aksha-chatbot-ui
    image: aksha-chatbot-ui:latest
    container_name: aksha-chatbot-ui
    restart: always
    networks:
      - aksha-net
    ports:
      - "${CHATBOT_UI_PORT:-8080}:80"
    depends_on:
      - aksha-chatbot-api

networks:
  aksha-net:
    external: true
