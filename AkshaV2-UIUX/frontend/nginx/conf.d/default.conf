server {
    listen       80;
    server_name  _;

    location /api/ {
        proxy_pass http://node_backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /v1/ {
        proxy_pass http://aksha-chatbot-api:8010/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Alert frame images, e.g. /cam3/alerts/2026-09-04/2026-09-04 09:54:52_alert.jpg.
    # The Node API returns these as absolute http://localhost:5000/... URLs
    # (baked into its own config), unreachable from any browser that isn't on
    # the server's own machine. The chatbot UI rewrites those to same-origin
    # relative paths before rendering; this route is what makes the rewritten
    # path actually resolve.
    location ~ ^/[^/]+/alerts/ {
        proxy_pass http://node_backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    #access_log  /var/log/nginx/host.access.log  main;

    # CRA's build output filenames are content-hashed (main.<hash>.js) — a
    # new build always gets a new URL, so these can be cached indefinitely.
    location /static/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one file whose *name* never changes between builds —
    # it's the only thing telling the browser which hashed bundle is current.
    # Without an explicit Cache-Control, browsers apply heuristic freshness
    # from Last-Modified alone and can skip revalidation entirely, serving a
    # stale index.html (pointing at an old, possibly-gone bundle) for an
    # unpredictable stretch after every deploy. Force revalidation on every
    # load instead — the ETag/Last-Modified check below still makes an
    # unchanged reload cheap (304), it just can't be skipped.
    location / {
        root   /usr/share/nginx/html;
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache";
        # index  index.html index.htm;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
